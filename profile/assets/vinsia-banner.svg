<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" fill="none">
  <defs>
    <!-- Dark Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#07090C" />
      <stop offset="100%" stop-color="#0E1219" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F39A45" />
      <stop offset="100%" stop-color="#E28D38" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="circuit-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2633" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#E28D38" fill-opacity="0.3"/>
    </pattern>

    <!-- Ambient Blurs -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#1F2633" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glows -->
  <circle cx="280" cy="160" r="150" fill="#E28D38" opacity="0.10" filter="url(#glow-gold)" />
  <circle cx="920" cy="160" r="130" fill="#38BDF8" opacity="0.08" filter="url(#glow-cyan)" />

  <!-- Background Grid -->
  <rect width="1200" height="320" rx="16" fill="url(#circuit-grid)" />

  <!-- Technical Corner Accents -->
  <path d="M 24 40 L 24 24 L 40 24" stroke="#E28D38" stroke-width="2" fill="none" />
  <path d="M 1176 40 L 1176 24 L 1160 24" stroke="#1F2633" stroke-width="2" fill="none" />
  <path d="M 24 280 L 24 296 L 40 296" stroke="#1F2633" stroke-width="2" fill="none" />
  <path d="M 1176 280 L 1176 296 L 1160 296" stroke="#E28D38" stroke-width="2" fill="none" />

  <!-- Top Metadata Bar -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">
    <circle cx="48" cy="48" r="4" fill="#10B981" />
    <text x="60" y="52" fill="#10B981">VINSIA ECOSYSTEM // PRODUCTION ONLINE</text>
    <text x="1152" y="52" fill="#64748B" text-anchor="end">SYS_BUILD: v2026.10 • ARCH: DISTRIBUTED</text>
  </g>

  <!-- Center Decorative SVG Rings -->
  <g transform="translate(600, 160)" stroke="currentColor" fill="none" opacity="0.15">
    <circle cx="0" cy="0" r="140" stroke="#E28D38" stroke-width="1" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="105" stroke="#38BDF8" stroke-width="1" />
    <circle cx="0" cy="0" r="70" stroke="#E28D38" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#E28D38" stroke-width="0.8" stroke-dasharray="8 8" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="8 8" />
  </g>

  <!-- Main Center Header -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, sans-serif">
    <!-- Brand Title -->
    <text x="600" y="152" font-size="52" font-weight="900" letter-spacing="-1.5" fill="#FFFFFF">
      VINS<tspan fill="url(#gold-grad)">IA</tspan>
    </text>

    <!-- Subtitle -->
    <text x="600" y="188" font-size="14" font-weight="700" letter-spacing="4" fill="#94A3B8">
      ARCHITECTING MODERN DIGITAL ECOSYSTEMS
    </text>

    <!-- Slogan / Tagline -->
    <text x="600" y="216" font-size="13" font-weight="500" fill="#E28D38" letter-spacing="1">
      Deploy. Connect. Scale.
    </text>
  </g>

  <!-- Bottom Pills / Tags -->
  <g transform="translate(600, 264)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600">
    <!-- Portal -->
    <rect x="-310" y="-12" width="95" height="24" rx="12" fill="#101520" stroke="#1F2633" />
    <text x="-262" y="4" fill="#E28D38">● PORTAL</text>

    <!-- Auth SSO -->
    <rect x="-205" y="-12" width="105" height="24" rx="12" fill="#101520" stroke="#1F2633" />
    <text x="-152" y="4" fill="#38BDF8">● AUTH SSO</text>

    <!-- Cloud -->
    <rect x="-90" y="-12" width="90" height="24" rx="12" fill="#101520" stroke="#1F2633" />
    <text x="-45" y="4" fill="#A855F7">● CLOUD</text>

    <!-- Store -->
    <rect x="10" y="-12" width="85" height="24" rx="12" fill="#101520" stroke="#1F2633" />
    <text x="52" y="4" fill="#10B981">● STORE</text>

    <!-- AI -->
    <rect x="105" y="-12" width="80" height="24" rx="12" fill="#101520" stroke="#1F2633" />
    <text x="145" y="4" fill="#F43F5E">● AI ENGINE</text>

    <!-- Studio -->
    <rect x="195" y="-12" width="95" height="24" rx="12" fill="#101520" stroke="#1F2633" />
    <text x="242" y="4" fill="#F59E0B">● STUDIO</text>
  </g>

  <!-- Subtle bottom decorative line -->
  <line x1="200" y1="319" x2="1000" y2="319" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.6" />
</svg>
